name: GuiDumper
version: 1.0.0
main: com.guidumper.GuiDumperPlugin
api-version: '1.21'
author: Teacher
description: Exports the server's own custom inventory GUIs to JSON, for backup and rebuilding.

commands:
  guidump:
    description: Dumps the currently open custom GUI to JSON.
    usage: /guidump [player]
    permission: guidumper.dump
    permission-message: You do not have permission to use this command.

permissions:
  guidumper.dump:
    description: Allows dumping the currently open GUI to JSON.
    default: op
